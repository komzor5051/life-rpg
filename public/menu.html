<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>life-rpg menu</title>
<style>
:root{--bg:#141517;--panel:#1B1D21;--line:#272A2F;--ink:#E6E6E1;--mute:#8F9298;--acc:#C8F04C;--track:#23262B}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,"Inter Tight",system-ui,sans-serif;-webkit-user-select:none;overflow:hidden}
.wrap{padding:16px 18px 14px}
.head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.hero{width:56px;height:56px;border-radius:14px;background:var(--track);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;flex:none}
.hero img{height:56px;width:auto;display:block}
.name{font-size:17px;font-weight:600;letter-spacing:-.01em}.cls{color:var(--mute);font-size:12px;margin-top:1px}
.lvl{margin-left:auto;background:var(--acc);color:#0F1011;font-weight:700;font-size:11px;padding:4px 9px;border-radius:999px}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px}.row .l{color:var(--mute)}.row .v{font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--track);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:3px;transition:width .4s}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.q{font-size:12px;color:var(--mute)}.qt{font-weight:600;margin-top:2px}
.today{display:flex;flex-direction:column;gap:6px;margin-top:8px}.t{display:flex;align-items:center;gap:8px;color:var(--mute)}.t.on{color:var(--ink)}
.t i{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--mute);flex:none;display:inline-flex;align-items:center;justify-content:center}
.t.on i{background:var(--acc);border-color:var(--acc)}.t.on i::after{content:"";width:7px;height:4px;border:2px solid #0F1011;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.t b{margin-left:auto;font-weight:600;color:var(--mute)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left;font-weight:500}
button:hover{border-color:var(--acc)}button.acc{background:var(--acc);border-color:var(--acc);color:#0F1011;font-weight:600;grid-column:1/-1;text-align:center}
button.ghost{background:transparent;color:var(--mute)}button:disabled{opacity:.5}
.sale{display:none;gap:8px;margin-top:8px}.sale.on{display:flex}
input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#101114;color:var(--ink);width:100%;-webkit-user-select:text}input:focus{outline:none;border-color:var(--acc)}
input[name=sum]{width:110px;flex:none;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips button{padding:4px 10px;font-size:12px;border-radius:999px;color:var(--mute)}
.foot{display:flex;justify-content:space-between;margin-top:12px}.foot button{padding:6px 10px;font-size:12px}
.toast{position:fixed;left:18px;right:18px;bottom:12px;background:var(--acc);color:#0F1011;font-weight:600;padding:8px 12px;border-radius:10px;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:1}
.off{padding:40px 18px;color:var(--mute);text-align:center}
</style></head><body>
<div class="wrap" id="app"><div class="off">Загрузка…</div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), fmt=n=>Math.round(+n||0).toLocaleString("ru-RU"), esc=s=>String(s??"").replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const toast=t=>{const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1800)};
const today=()=>new Date().toLocaleDateString("sv-SE");
async function log(b){await fetch("/api/log",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({d:today(),...b})});await load();}
let D=null;
async function load(){
  try{D=await fetch("/api/summary",{cache:"no-store"}).then(r=>r.json());}catch(e){$("#app").innerHTML='<div class="off">Сервер кабинета не отвечает</div>';return;}
  const d=D,mq=d.mainQuest,t=d.today||{},c=d.todayCounts||{};
  const pct=(a,b)=>Math.max(0,Math.min(100,100*(+a||0)/Math.max(1,+b||1)))+"%";
  let mt=String(mq?.title||"").replace(/^main quest:\s*/i,"");
  $("#app").innerHTML=`
  <div class="head"><div class="hero"><img src="/hero-thumb?${Date.now()}" alt=""></div><div><div class="name">${esc(d.name)}</div><div class="cls">${esc(d.class)}</div></div><div class="lvl">LVL ${d.level}</div></div>
  <div class="row"><span class="l">Опыт до уровня</span><span class="v">${fmt(d.xpIn)} / ${fmt(d.perLevel)}</span></div><div class="bar"><i style="width:${pct(d.xpIn,d.perLevel)}"></i></div>
  <div class="row"><span class="l">Стрик касаний</span><span class="v">${d.streak} дн · заморозки ${d.freezesLeft}</span></div>
  <hr>
  <div class="row"><span class="l">Босс недели</span><span class="v">${d.bossDead?"повержен · "+fmt(d.moneyWeek)+" ₽":fmt(d.bossHp)+" HP из "+fmt(d.weeklyGoal)}</span></div><div class="bar"><i style="width:${pct(d.moneyWeek,d.weeklyGoal)}"></i></div>
  ${mq?`<div class="row"><span class="l">Main quest</span><span class="v">${mq.target?fmt(mq.progress)+" / "+fmt(mq.target)+" ₽":""}</span></div><div class="qt">${esc(mt)}</div>${mq.target?`<div class="bar"><i style="width:${pct(mq.progress,mq.target)}"></i></div>`:""}`:""}
  <hr>
  <div class="q">Сегодня · день ${d.dayN}</div>
  <div class="today">
    <div class="t ${t.sale?"on":""}"><i></i>Касание<b>${c.sale||""}</b></div>
    <div class="t ${t.content?"on":""}"><i></i>Публикация<b>${c.content||""}</b></div>
    <div class="t ${t.day?"on":""}"><i></i>День закрыт</div>
  </div>
  <hr>
  <div class="acts">
    <button class="acc" id="bsale">Продал</button>
    <button id="btouch">Касание +1</button><button id="bpost">Публикация +1</button>
  </div>
  <form class="sale" id="sale"><input name="sum" type="number" min="1" placeholder="сумма, ₽" required><input name="src" placeholder="что и кому"><button class="acc" style="grid-column:auto;padding:8px 12px">OK</button></form>
  <div class="chips" id="chips"></div>
  <div class="foot"><button class="ghost" id="bday">${t.day?"День закрыт":"Закрыть день"}</button><button class="ghost" id="bopen">Открыть кабинет</button></div>`;
  $("#bopen").onclick=()=>fetch("/api/open",{method:"POST",body:"{}"});
  $("#bsale").onclick=()=>{const f=$("#sale");f.classList.toggle("on");if(f.classList.contains("on"))f.sum.focus();};
  $("#btouch").onclick=async e=>{e.target.disabled=true;await log({type:"sale",n:1,src:"menubar"});toast("Касание записано");};
  $("#bpost").onclick=async e=>{e.target.disabled=true;await log({type:"content",n:1,src:"menubar"});toast("Публикация записана");};
  $("#bday").onclick=async()=>{const en=prompt("Энергия сегодня, 1-10","7");if(!en||isNaN(+en))return;const src=prompt("Что бросил сегодня и почему","")||"";await log({type:"day",energy:+en,src});toast("День закрыт");};
  $("#sale").onsubmit=async e=>{e.preventDefault();const f=e.target,sum=+f.sum.value;if(!sum)return;const src=f.src.value.trim();f.querySelector("button").disabled=true;await log({type:"money",sum,src});toast(`+${fmt(sum)} ₽ · босс получил урон`);};
  (d.presets||[]).forEach(p=>{const b=document.createElement("button");b.type="button";b.textContent=p.sum?`${p.src} · ${fmt(p.sum)} ₽`:p.src;b.onclick=()=>{const f=$("#sale");f.classList.add("on");if(p.sum)f.sum.value=p.sum;f.src.value=p.src;f.sum.focus();};$("#chips").appendChild(b);});
}
load();setInterval(load,20000);
</script></body></html>
